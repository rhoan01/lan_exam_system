[mysqld]
basedir=C:/MySQL/mysql-8.4.11-winx64
datadir=C:/ProgramData/MySQL/ExamSystem84/data

# Keep the database private to this computer. Students connect only to the
# Django web server; MySQL must never be exposed directly to the LAN.
bind-address=127.0.0.1
port=3307
mysqlx=0

default-storage-engine=INNODB
character-set-server=utf8mb4
collation-server=utf8mb4_0900_ai_ci
sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
local-infile=0

log-error=C:/ProgramData/MySQL/ExamSystem84/mysql.err

[client]
protocol=TCP
host=127.0.0.1
port=3307
