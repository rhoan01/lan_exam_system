{% extends 'base.html' %}
{% block title %}New Subject{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <h2>New Subject</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <p>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="helptext" style="color:#a5322a;">{{ error }}</div>{% endfor %}
      </p>
    {% endfor %}
    <button type="submit" class="btn btn-accent">Save</button>
    <a href="{% url 'exams:instructor_dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
